        body {

            background-size: cover;

            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        
        .navbar {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 15px;
            text-align: right;
        }

        .navbar a {
            background-color: white;
            color: black;
            text-decoration: none;
            padding: 10px 20px;
            margin-right: 10px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
        }

        .navbar a:hover {
            background-color: #c8102e;
            color: white;
        }

        h1 {
            background-color: white;
            color: black;

            color: white;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
        }

        .defence-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }

        .attack-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .player {
            background-color: rgba(255, 255, 255, 0.95);
            width: 30%;
            padding: 15px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        .player:hover {
            transform: translateY(-10px);
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.7);
        }

        .player img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }

        .player p {
            font-size: 20px;
            font-weight: bold;
            color: #c8102e;
            margin: 15px 0;
        }

        .section-title {
            text-align: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 15px;
            margin-top: 50px;
        }

        footer {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        @media (max-width: 900px) {

            .defence-container,
            .attack-container {
                flex-direction: column;
                align-items: center;
            }

            .player {
                width: 80%;
            }

        }

    </style>

</head>
